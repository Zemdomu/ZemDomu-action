name: Run ZemDomu Linter

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      crossComponentAnalysis:
        description: "Enable cross component analysis"
        required: false
        default: "false"
      warningOnly:
        description: "Emit warnings instead of errors"
        required: false
        default: "false"
      configPath:
        description: "Path to JSON config file defining rule severities"
        required: false
        default: ".zemdomurc.json"

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache Node.js dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
            ${{ runner.os }}-
      - name: Cleanup dependencies
        run: rm -rf node_modules
      - name: Install dependencies
        run: npm ci
      - name: Build ZemDomu action
        run: npm run build
      - name: Create failing test file
        run: |
          cat << 'EOF' > lint-test.html
          <!DOCTYPE html>
          <html><body>
            <h1>One</h1>
            <h1>Two</h1>
          </body></html>
          EOF
      - name: Run warnings-only check
        run: |-
          node dist/index.js --files lint-test.html --warningOnly=true
      - name: Run ZemDomu semantic linter
        uses: ./
        with:
          files: "**/*.{html,jsx,tsx}"
          crossComponentAnalysis: ${{ inputs.crossComponentAnalysis }}
          warningOnly: ${{ inputs.warningOnly }}
          configPath: ${{ inputs.configPath }}
      - name: Upload SARIF report
        if: always()
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif-file: zemdomu-report.sarif
