name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'Zemdomu/ZemDomu-action'
    name: Test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Test release boundaries
        run: node --test .github/tests/*.test.mjs
      - name: Install dependencies and build bundle
        run: npm ci
      - name: Check TypeScript
        run: npx --no-install tsc --noEmit
      - name: Run tests and rebuild bundle
        run: npm test
      - name: Verify committed bundle is up to date
        run: git diff --exit-code -- dist/
      - name: Measure direct TypeScript source coverage
        if: matrix.node == 24
        run: |
          npm run test:coverage
          git diff --exit-code -- dist/
