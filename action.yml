name: 'ZemDomu GitHub Action'
description: 'Find semantic HTML and accessibility issues in HTML, JSX, TSX, and Vue pull requests'
author: 'Zacharias Eryd Berlin'
inputs:
  files:
    description: 'Glob patterns of files to lint'
    required: false
    default: '**/*.{html,jsx,tsx,vue}'
  crossComponentAnalysis:
    description: 'Analyze supported issues across local React and Vue component imports'
    required: false
    default: 'false'
  crossComponentDepth:
    description: 'Maximum local import depth for cross-component analysis'
    required: false
    default: '3'
outputs:
  sarif:
    description: 'Absolute path to the generated ZemDomu SARIF 2.1.0 report'
runs:
  using: 'node24'
  main: 'dist/index.js'
branding:
  icon: 'check-circle'
  color: 'blue'
