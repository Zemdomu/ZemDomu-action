name: Run ZemDomu Linter

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "**/*.jsx"
      - "**/*.tsx"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.html"
      - "**/*.jsx"
      - "**/*.tsx"
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cleanup dependencies
        run: rm -rf node_modules
      - name: Install dependencies
        run: npm ci
      - name: Build ZemDomu action
        run: npm run build
      - name: Create failing test file
        run: |
          cat << 'EOF' > lint-test.html
          <!DOCTYPE html>
          <html><body>
            <h1>One</h1>
            <h1>Two</h1>
          </body></html>
          EOF
      - name: Run warnings-only check
        run: |-
          node dist/index.js --files lint-test.html --warningOnly=true
      - name: Run ZemDomu semantic linter
        uses: ./
        with:
          files: "**/*.{html,jsx,tsx}"
          crossComponentAnalysis: "true"
          warningOnly: "false"
