name: 'ZemDomu Lint'
description: 'Run ZemDomu semantic linter'
author: 'Zacharias Eryd Berlin'
inputs:
  files:
    description: 'Glob patterns of files to lint'
    required: false
    default: '**/*.{html,jsx,tsx}'
  crossComponentAnalysis:
    description: 'Enable cross component analysis'
    required: false
    default: 'false'
  warningOnly:
    description: 'Emit warnings instead of errors and do not fail the job'
    required: false
    default: 'false'
  singleH1:
    description: 'Severity for the single-H1 rule'
    required: false
    type: choice
    default: error
    options:
      - off
      - warning
      - error
  enforceHeadingOrder:
    description: 'Severity for the heading-order rule'
    required: false
    type: choice
    default: error
    options:
      - off
      - warning
      - error
  enforceListNesting:
    description: 'Severity for the list-nesting rule'
    required: false
    type: choice
    default: error
    options:
      - off
      - warning
      - error
  noTabindexGreaterThanZero:
    description: 'Severity for the tabindex rule'
    required: false
    type: choice
    default: error
    options:
      - off
      - warning
      - error
  preventEmptyInlineTags:
    description: 'Severity for the empty-inline-tags rule'
    required: false
    type: choice
    default: error
    options:
      - off
      - warning
      - error
  requireAltText:
    description: 'Severity for the img-alt rule'
    required: false
    type: choice
    default: error
    options:
      - off
      - warning
      - error
  requireButtonText:
    description: 'Severity for the button-text rule'
    required: false
    type: choice
    default: error
    options:
      - off
      - warning
      - error
  requireHrefOnAnchors:
    description: 'Severity for the anchor-href rule'
    required: false
    type: choice
    default: error
    options:
      - off
      - warning
      - error
  requireHtmlLang:
    description: 'Severity for the html@lang rule'
    required: false
    type: choice
    default: warning
    options:
      - off
      - warning
      - error
  requireIframeTitle:
    description: 'Severity for the iframe-title rule'
    required: false
    type: choice
    default: error
    options:
      - off
      - warning
      - error
  requireImageInputAlt:
    description: 'Severity for image-input alt text'
    required: false
    type: choice
    default: error
    options:
      - off
      - warning
      - error
  requireLabelForFormControls:
    description: 'Severity for label-for rule'
    required: false
    type: choice
    default: error
    options:
      - off
      - warning
      - error
  requireLinkText:
    description: 'Severity for the link-text rule'
    required: false
    type: choice
    default: error
    options:
      - off
      - warning
      - error
  requireNavLinks:
    description: 'Severity for the nav-links rule'
    required: false
    type: choice
    default: error
    options:
      - off
      - warning
      - error
  requireSectionHeading:
    description: 'Severity for the section-heading rule'
    required: false
    type: choice
    default: error
    options:
      - off
      - warning
      - error
  requireTableCaption:
    description: 'Severity for table caption rule'
    required: false
    type: choice
    default: error
    options:
      - off
      - warning
      - error
  uniqueIds:
    description: 'Severity for the unique-ids rule'
    required: false
    type: choice
    default: error
    options:
      - off
      - warning
      - error
runs:
  using: 'node20'
  main: 'dist/index.js'
