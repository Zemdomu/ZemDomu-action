name: Build and release verified Action

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed public main commit (40 lowercase hex characters)
        required: true
        type: string
      expected_version:
        description: Exact prepared package version
        required: true
        type: string
      publish:
        description: Publish a real prepared release; false only builds and attests
        required: true
        default: false
        type: boolean
  repository_dispatch:
    types: [zemdomu-action-release]

permissions:
  contents: read

concurrency:
  group: action-release
  cancel-in-progress: false

env:
  EXPECTED_COMMIT: ${{ github.event.client_payload.sha || inputs.expected_commit }}
  EXPECTED_VERSION: ${{ github.event.client_payload.version || inputs.expected_version }}
  PUBLISH_RELEASE: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.publish) || toJSON(inputs.publish) }}

jobs:
  build:
    if: github.repository == 'Zemdomu/ZemDomu-action' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      asset_name: ${{ steps.record.outputs.asset_name }}
      publish: ${{ steps.record.outputs.publish }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out exact public workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up build runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Test release boundaries
        run: node --test .github/tests/*.test.mjs
      - name: Verify exact protected source and latest CI and CodeQL attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-action.mjs gate "$EXPECTED_COMMIT" "$EXPECTED_VERSION" "$PUBLISH_RELEASE"
      - name: Build, audit and test the actual Action archive without write permissions
        run: |
          npm ci
          npm run audit:production
          npm run audit:all
          npx --no-install tsc --noEmit
          npm test
          git diff --exit-code -- dist/
          npm run test:coverage
          git diff --exit-code -- dist/
          mkdir -p "$RUNNER_TEMP/action-release"
          npm pack --pack-destination "$RUNNER_TEMP/action-release"
          git diff --exit-code -- dist/
      - name: Smoke-test packed bytes and bind the public build record
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-action.mjs prepare "$EXPECTED_COMMIT" "$EXPECTED_VERSION" "$PUBLISH_RELEASE" "$RUNNER_TEMP/action-release"
      - name: Retain exact original build bytes
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: action-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/action-release/
          if-no-files-found: error
          retention-days: 14

  attest:
    needs: build
    if: github.repository == 'Zemdomu/ZemDomu-action' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out exact public release control source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up verification runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Download this attempt's exact build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/action-release
          merge-multiple: true
          digest-mismatch: error
      - name: Recheck original build record before attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-action.mjs check "$EXPECTED_COMMIT" "$EXPECTED_VERSION" "$PUBLISH_RELEASE" "$RUNNER_TEMP/action-release"
      - name: Attest the exact built tarball
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/action-release/${{ needs.build.outputs.asset_name }}
          create-storage-record: false
      - name: Install pinned signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Verify and retain the original signed SLSA bundle and DSSE envelope
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: node .github/scripts/release-action.mjs export "$EXPECTED_COMMIT" "$EXPECTED_VERSION" "$PUBLISH_RELEASE" "$RUNNER_TEMP/action-release" "$BUNDLE_PATH"
      - name: Retain attested release or build-only validation evidence
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: action-attested-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/action-release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [build, attest]
    if: needs.build.outputs.publish == 'true' && github.repository == 'Zemdomu/ZemDomu-action' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out exact public release control source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up publication runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Download only this attempt's attested artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.attest.outputs.artifact_id }}
          path: ${{ runner.temp }}/action-release
          merge-multiple: true
          digest-mismatch: error
      - name: Install pinned signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Publish exact verified bytes and dispatch signatures after every asset is final
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-action.mjs publish "$EXPECTED_COMMIT" "$EXPECTED_VERSION" "$PUBLISH_RELEASE" "$RUNNER_TEMP/action-release"
