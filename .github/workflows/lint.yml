name: Run ZemDomu Linter

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "**/*.jsx"
      - "**/*.tsx"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.html"
      - "**/*.jsx"
      - "**/*.tsx"
  workflow_dispatch:
    inputs:
      crossComponentAnalysis:
        description: 'Enable cross component analysis'
        required: false
        default: 'false'
      warningOnly:
        description: 'Emit warnings instead of errors'
        required: false
        default: 'false'
      singleH1:
        description: 'Severity for singleH1'
        type: choice
        default: error
        options: [off, warning, error]
      enforceHeadingOrder:
        description: 'Severity for enforceHeadingOrder'
        type: choice
        default: error
        options: [off, warning, error]
      enforceListNesting:
        description: 'Severity for enforceListNesting'
        type: choice
        default: error
        options: [off, warning, error]
      noTabindexGreaterThanZero:
        description: 'Severity for noTabindexGreaterThanZero'
        type: choice
        default: error
        options: [off, warning, error]
      preventEmptyInlineTags:
        description: 'Severity for preventEmptyInlineTags'
        type: choice
        default: error
        options: [off, warning, error]
      requireAltText:
        description: 'Severity for requireAltText'
        type: choice
        default: error
        options: [off, warning, error]
      requireButtonText:
        description: 'Severity for requireButtonText'
        type: choice
        default: error
        options: [off, warning, error]
      requireHrefOnAnchors:
        description: 'Severity for requireHrefOnAnchors'
        type: choice
        default: error
        options: [off, warning, error]
      requireHtmlLang:
        description: 'Severity for requireHtmlLang'
        type: choice
        default: warning
        options: [off, warning, error]
      requireIframeTitle:
        description: 'Severity for requireIframeTitle'
        type: choice
        default: error
        options: [off, warning, error]
      requireImageInputAlt:
        description: 'Severity for requireImageInputAlt'
        type: choice
        default: error
        options: [off, warning, error]
      requireLabelForFormControls:
        description: 'Severity for requireLabelForFormControls'
        type: choice
        default: error
        options: [off, warning, error]
      requireLinkText:
        description: 'Severity for requireLinkText'
        type: choice
        default: error
        options: [off, warning, error]
      requireNavLinks:
        description: 'Severity for requireNavLinks'
        type: choice
        default: error
        options: [off, warning, error]
      requireSectionHeading:
        description: 'Severity for requireSectionHeading'
        type: choice
        default: error
        options: [off, warning, error]
      requireTableCaption:
        description: 'Severity for requireTableCaption'
        type: choice
        default: error
        options: [off, warning, error]
      uniqueIds:
        description: 'Severity for uniqueIds'
        type: choice
        default: error
        options: [off, warning, error]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cleanup dependencies
        run: rm -rf node_modules
      - name: Install dependencies
        run: npm ci
      - name: Build ZemDomu action
        run: npm run build
      - name: Create failing test file
        run: |
          cat << 'EOF' > lint-test.html
          <!DOCTYPE html>
          <html><body>
            <h1>One</h1>
            <h1>Two</h1>
          </body></html>
          EOF
      - name: Run warnings-only check
        run: |-
          node dist/index.js --files lint-test.html --warningOnly=true
      - name: Run ZemDomu semantic linter
        uses: ./
        with:
          files: "**/*.{html,jsx,tsx}"
          crossComponentAnalysis: ${{ inputs.crossComponentAnalysis }}
          warningOnly: ${{ inputs.warningOnly }}
          singleH1: ${{ inputs.singleH1 }}
          enforceHeadingOrder: ${{ inputs.enforceHeadingOrder }}
          enforceListNesting: ${{ inputs.enforceListNesting }}
          noTabindexGreaterThanZero: ${{ inputs.noTabindexGreaterThanZero }}
          preventEmptyInlineTags: ${{ inputs.preventEmptyInlineTags }}
          requireAltText: ${{ inputs.requireAltText }}
          requireButtonText: ${{ inputs.requireButtonText }}
          requireHrefOnAnchors: ${{ inputs.requireHrefOnAnchors }}
          requireHtmlLang: ${{ inputs.requireHtmlLang }}
          requireIframeTitle: ${{ inputs.requireIframeTitle }}
          requireImageInputAlt: ${{ inputs.requireImageInputAlt }}
          requireLabelForFormControls: ${{ inputs.requireLabelForFormControls }}
          requireLinkText: ${{ inputs.requireLinkText }}
          requireNavLinks: ${{ inputs.requireNavLinks }}
          requireSectionHeading: ${{ inputs.requireSectionHeading }}
          requireTableCaption: ${{ inputs.requireTableCaption }}
          uniqueIds: ${{ inputs.uniqueIds }}
