name: 'ZemDomu GitHub Action'
description: 'Annotate pull requests with supported ZemDomu semantic accessibility findings'
author: 'Zacharias Eryd Berlin'
inputs:
  files:
    description: 'Glob patterns of files to lint'
    required: false
    default: '**/*.{html,jsx,tsx,vue}'
  crossComponentAnalysis:
    description: 'Analyze supported issues across local React and Vue component imports'
    required: false
    default: 'false'
  crossComponentDepth:
    description: 'Maximum local import depth for cross-component analysis'
    required: false
    default: '3'
runs:
  using: 'node20'
  main: 'dist/index.js'
